name: Publish to npm

# Publishes @bluefyn/ai-spend-sdk with npm provenance, a signed attestation that this workflow built
# the tarball from this repository (`npm audit signatures` verifies it). RELEASING.md has the
# release steps and the one-time setup.
#
# Trigger: a `vX.Y.Z` tag pushed on a commit of main. Publishes only a well-formed `vX.Y.Z[-pre]`
# tag whose commit is on main, after the version guard (tag = package.json = AI_SPEND_SDK_VERSION).
# Ref names reach the shell only through environment variables, never inline expressions.
#
# Auth: npm trusted publishing (OIDC). The trusted publisher of @bluefyn/ai-spend-sdk on npmjs.com
# names this repository, this workflow file (publish.yml) and the `npm-publish` environment; no
# secret is involved. npm can only add a trusted publisher to a package that already exists, so the
# FIRST release is published with a short-lived granular token, the `NPM_TOKEN` secret of the
# `npm-publish` environment, which is deleted once the trusted publisher is set. The Publish step
# works in both states: npm tries OIDC first and falls back to the token when the secret is set.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance (OIDC)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    steps:
      - name: Tag is vX.Y.Z
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::only vX.Y.Z tags are published — this run is on another ref"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Trusted publishing needs npm >= 11.5.1; Node 24.19.0 ships npm 11.17.0.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Merge first, then tag the merge commit."
            exit 1
          fi

      - name: Version guard (tag = package.json = AI_SPEND_SDK_VERSION)
        id: version
        run: |
          set -euo pipefail
          version=$(node scripts/check-version.mjs "${GITHUB_REF_NAME#v}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease (1.2.0-beta.1) goes to the `next` dist-tag, never `latest`.
          if [[ "$version" == *-* ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi

      - name: Not published yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@bluefyn/ai-spend-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@bluefyn/ai-spend-sdk@$VERSION is already on npm — bump the version"
            exit 1
          fi

      - name: Install (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (sources + specs)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Before `Build + smoke`: check-docs builds dist/ itself, so the tarball must come from the
      # build that the smoke test loaded.
      - name: README code samples compile
        run: npm run check-docs

      - name: Build + smoke
        run: npm run build

      - name: Pack (verify contents)
        run: npm pack --dry-run

      - name: Compatibility check (min)
        run: node scripts/compat-check.mjs --matrix min

      # `.npmrc` sets ignore-scripts, so nothing builds on `npm publish`: the build above is what
      # gets published. package.json `private` makes any other `npm publish` fail (EPRIVATE); only
      # this step removes it. publishConfig sets access=public and provenance=true; both are
      # repeated on the command line so a manifest edit cannot drop them silently.
      - name: Publish
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$NPM_TOKEN" ]; then
            echo "::warning::publishing with the NPM_TOKEN bootstrap secret. Once this version is on npm, add the trusted publisher on npmjs.com and delete the secret (RELEASING.md)."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm pkg delete private //private
          if ! npm publish --access public --provenance --tag "$DIST_TAG"; then
            if [ -z "$NPM_TOKEN" ]; then
              echo "::error::npm publish failed with no NPM_TOKEN secret, so it authenticated by trusted publishing: check the trusted publisher of @bluefyn/ai-spend-sdk on npmjs.com (repository bluefyn/ai-sdk, workflow publish.yml, environment npm-publish) and that npm $(npm --version) is >= 11.5.1"
            fi
            exit 1
          fi

      - name: Verify on the registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm view "@bluefyn/ai-spend-sdk@$VERSION" version; then exit 0; fi
            sleep 10
          done
          echo "::error::@bluefyn/ai-spend-sdk@$VERSION was published but is not visible on the registry yet"
          exit 1
